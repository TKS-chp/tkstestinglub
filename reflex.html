<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>超精密・条件判断反射神経診断 | 脳機能解析</title>
  <style>
    :root {
      --bg-dark: #050813;
      --panel-bg: rgba(11, 19, 43, 0.85);
      --accent-cyan: #00f0ff;
      --accent-green: #00ff88;
      --accent-red: #ff0055;
      --accent-yellow: #ffe600;
      --text-main: #f1f5f9;
      --text-sub: #8295b9;
      --border-color: #1e2c4f;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", sans-serif;
    }

    /* 背景サイバーグリッド＆走査線 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 1;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 2;
    }

    /* 全画面タップターゲット */
    #test-viewport {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
      z-index: 10;
      transition: background-color 0.08s ease;
      padding: 20px;
    }

    /* 状態別の画面全体カラー発光 */
    .view-idle {
      background-color: transparent;
    }
    .view-waiting {
      background-color: #0b152d;
      box-shadow: inset 0 0 100px rgba(0, 240, 255, 0.15);
    }
    .view-go {
      background-color: #00ff88 !important;
      box-shadow: inset 0 0 150px rgba(255, 255, 255, 0.8);
      color: #050813 !important;
    }
    .view-nogo {
      background-color: #ff0055 !important;
      box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.8);
      color: #ffffff !important;
    }

    /* HUD ヘッダー */
    .hud-topbar {
      position: fixed;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      pointer-events: auto;
    }
    .hud-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--accent-cyan);
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }
    .hud-controls {
      display: flex;
      gap: 10px;
    }
    .hud-btn {
      background: rgba(11, 19, 43, 0.8);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      padding: 8px 14px;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .hud-btn:hover {
      background: var(--accent-cyan);
      color: var(--bg-dark);
      box-shadow: 0 0 15px var(--accent-cyan);
    }

    /* 中央の照準・指示メッセージ */
    .reticle-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      text-align: center;
    }
    .target-symbol {
      font-size: 4rem;
      margin-bottom: 10px;
      line-height: 1;
    }
    .target-msg-main {
      font-size: 2.4rem;
      font-weight: bold;
      letter-spacing: 3px;
      text-shadow: 0 0 20px currentColor;
    }
    .target-msg-sub {
      font-size: 1rem;
      margin-top: 10px;
      opacity: 0.85;
      letter-spacing: 1px;
    }

    /* 進行状況バー（下部） */
    .rounds-hud {
      position: fixed;
      bottom: 25px;
      display: flex;
      gap: 12px;
      z-index: 25;
      pointer-events: none;
    }
    .round-cell {
      width: 32px;
      height: 8px;
      background: rgba(30, 44, 79, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 2px;
      transition: all 0.2s ease;
    }
    .round-cell.active {
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
      border-color: #fff;
    }
    .round-cell.done {
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }
    .round-cell.failed {
      background: var(--accent-red);
      box-shadow: 0 0 8px var(--accent-red);
    }

    /* 詳細分析レポート（結果カード） */
    #report-modal {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 19, 0.95);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }
    .report-card {
      background: var(--panel-bg);
      border: 2px solid var(--accent-cyan);
      border-radius: 14px;
      max-width: 640px;
      width: 100%;
      padding: 25px;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.25);
      position: relative;
    }
    .report-badge {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--accent-yellow);
      text-align: center;
      text-shadow: 0 0 15px rgba(255, 230, 0, 0.6);
    }
    .report-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--accent-green);
      text-align: center;
      margin-top: 4px;
      margin-bottom: 20px;
    }
    .report-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }
    .report-item {
      background: #0d162e;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
    }
    .report-label {
      font-size: 0.75rem;
      color: var(--text-sub);
    }
    .report-val {
      font-size: 1.35rem;
      font-weight: bold;
      color: var(--text-main);
      margin-top: 4px;
    }

    /* 正規分布グラフ */
    .chart-box {
      background: #080d1d;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 18px;
    }
    .chart-header {
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--accent-cyan);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    #chart-canvas {
      width: 100%;
      height: 160px;
      display: block;
    }

    .report-text {
      background: #0d162e;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .action-row {
      display: flex;
      gap: 12px;
    }
    .action-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.2s;
    }
    .action-btn-retry {
      background: var(--accent-cyan);
      color: var(--bg-dark);
    }
    .action-btn-share {
      background: #3b82f6;
      color: #fff;
    }
    .toast-msg {
      display: none;
      text-align: center;
      font-size: 0.8rem;
      color: var(--accent-green);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- HUD 上部メニュー -->
  <div class="hud-topbar">
    <div class="hud-title">⚡ 条件判断・反射計測HUD</div>
    <div class="hud-controls">
      <button class="hud-btn" onclick="toggleFullscreen()">🖥️ 全画面表示</button>
      <a href="lab.html" class="hud-btn">← ラボに戻る</a>
    </div>
  </div>

  <!-- 全画面タップ検知フィールド -->
  <div id="test-viewport" class="view-idle">
    <div class="reticle-wrap">
      <div class="target-symbol" id="target-icon">🎯</div>
      <div class="target-msg-main" id="target-main">画面タップで開始</div>
      <div class="target-msg-sub" id="target-sub">緑が出たら最速タップ / 赤は絶対に押すな</div>
    </div>
  </div>

  <!-- 下部進行状況 -->
  <div class="rounds-hud" id="rounds-hud"></div>

  <!-- 詳細レポート画面（全画面モーダル） -->
  <div id="report-modal">
    <div class="report-card">
      <div class="report-badge" id="rep-rank">-</div>
      <div class="report-title" id="rep-title">-</div>

      <div class="report-grid">
        <div class="report-item">
          <div class="report-label">平均判断反応速度</div>
          <div class="report-val" id="rep-speed" style="color: var(--accent-cyan);">- ms</div>
        </div>
        <div class="report-item">
          <div class="report-label">衝動ブレーキ成功率</div>
          <div class="report-val" id="rep-brake" style="color: var(--accent-green);">100%</div>
        </div>
        <div class="report-item">
          <div class="report-label">全人類推定偏差値</div>
          <div class="report-val" id="rep-dev">-</div>
        </div>
        <div class="report-item">
          <div class="report-label">全体位置</div>
          <div class="report-val" id="rep-percent" style="color: var(--accent-yellow);">-</div>
        </div>
      </div>

      <!-- 正規分布グラフ -->
      <div class="chart-box">
        <div class="chart-header">
          <span>正規分布比較（人類全体での位置）</span>
          <span style="color: var(--text-sub);">基準: 平均340ms / 標準偏差50ms</span>
        </div>
        <canvas id="chart-canvas" width="580" height="170"></canvas>
      </div>

      <div class="report-text" id="rep-analysis">
        分析文がここに表示されます。
      </div>

      <div class="action-row">
        <button class="action-btn action-btn-retry" onclick="resetTest()">もう一度計測する</button>
        <button class="action-btn action-btn-share" onclick="copyReport()">結果をコピー</button>
      </div>
      <div class="toast-msg" id="toast-msg">結果をクリップボードにコピーしました！そのまま貼り付けできます。</div>
    </div>
  </div>

  <script>
    // 試行回数（全6回: 突撃4回、トラップ2回）
    const BASE_TRIALS = ['go', 'go', 'nogo', 'go', 'nogo', 'go'];
    let trialQueue = [];
    let currentIdx = 0;

    let state = 'idle'; // idle, waiting, go, nogo, interval, finished
    let waitTimer = null;
    let nogoTimer = null;
    let stimulusStartTime = 0;

    let recordedTimes = [];
    let trapFailCount = 0;
    let misfireCount = 0;

    // 音声コンテキスト（サイバー効果音）
    let audioCtx = null;
    function playBeep(freq, type, duration, vol = 0.1) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    const viewport = document.getElementById('test-viewport');
    const targetIcon = document.getElementById('target-icon');
    const targetMain = document.getElementById('target-main');
    const targetSub = document.getElementById('target-sub');
    const roundsHud = document.getElementById('rounds-hud');
    const reportModal = document.getElementById('report-modal');
    const toastMsg = document.getElementById('toast-msg');

    function initRounds() {
      roundsHud.innerHTML = '';
      for (let i = 0; i < BASE_TRIALS.length; i++) {
        const cell = document.createElement('div');
        cell.className = 'round-cell';
        cell.id = `cell-${i}`;
        roundsHud.appendChild(cell);
      }
    }

    function updateHudCells() {
      for (let i = 0; i < BASE_TRIALS.length; i++) {
        const cell = document.getElementById(`cell-${i}`);
        if (!cell) continue;
        cell.className = 'round-cell';
        if (i < currentIdx) {
          cell.classList.add('done');
        } else if (i === currentIdx && state !== 'finished') {
          cell.classList.add('active');
        }
      }
    }

    // 全画面切り替え
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // タップ・クリック・スペースキーの受付
    viewport.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      handleAction();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && state !== 'finished') {
        e.preventDefault();
        handleAction();
      }
    });

    function handleAction() {
      if (state === 'idle' || state === 'interval') {
        startWaiting();
      } else if (state === 'waiting') {
        // 色が出る前のフライングお手つき
        clearTimeout(waitTimer);
        misfireCount++;
        playBeep(180, 'sawtooth', 0.25, 0.2);
        state = 'interval';
        viewport.className = 'view-idle';
        targetIcon.innerText = '⚠️';
        targetMain.innerText = '早すぎます！（お手つき）';
        targetSub.innerText = '合図が出るまで待機してください。画面タップで再開';
      } else if (state === 'go') {
        // 緑色の即押し成功
        const ms = Math.round(performance.now() - stimulusStartTime);
        recordedTimes.push(ms);
        playBeep(880, 'sine', 0.15, 0.15);

        document.getElementById(`cell-${currentIdx}`).classList.add('done');
        currentIdx++;
        state = 'interval';
        viewport.className = 'view-idle';

        if (currentIdx >= BASE_TRIALS.length) {
          finishTest();
        } else {
          targetIcon.innerText = '⚡';
          targetMain.innerText = `${ms} ミリ秒！`;
          targetSub.innerText = `画面タップで第 ${currentIdx + 1} 回目の待機へ`;
          updateHudCells();
        }
      } else if (state === 'nogo') {
        // 赤色を押してしまった（衝動抑制失敗）
        clearTimeout(nogoTimer);
        trapFailCount++;
        playBeep(120, 'sawtooth', 0.35, 0.25);

        document.getElementById(`cell-${currentIdx}`).classList.add('failed');
        currentIdx++;
        state = 'interval';
        viewport.className = 'view-idle';

        if (currentIdx >= BASE_TRIALS.length) {
          finishTest();
        } else {
          targetIcon.innerText = '🚫';
          targetMain.innerText = 'トラップ！赤は我慢！';
          targetSub.innerText = `ブレーキ失敗。画面タップで第 ${currentIdx + 1} 回目へ`;
          updateHudCells();
        }
      }
    }

    function startWaiting() {
      state = 'waiting';
      viewport.className = 'view-waiting';
      targetIcon.innerText = '👁️';
      targetMain.innerText = '合図を待機中…';
      targetSub.innerText = '緑が出たら画面全体を即押し！ 赤なら完全静止！';
      updateHudCells();
      playBeep(440, 'triangle', 0.08, 0.05);

      // ★ 予測不能なロング待機時間（2.5秒 〜 6.5秒の超幅広ランダム）
      const randomWait = Math.floor(Math.random() * 4000) + 2500;
      waitTimer = setTimeout(triggerStimulus, randomWait);
    }

    function triggerStimulus() {
      const type = trialQueue[currentIdx];

      if (type === 'go') {
        state = 'go';
        viewport.className = 'view-go';
        targetIcon.innerText = '💥';
        targetMain.innerText = '今だッ！！ 叩け！';
        targetSub.innerText = '緑色が出現！ 画面のどこでも即タップ！';
        stimulusStartTime = performance.now();
        playBeep(1200, 'square', 0.08, 0.2);
      } else {
        state = 'nogo';
        viewport.className = 'view-nogo';
        targetIcon.innerText = '⛔';
        targetMain.innerText = '待て！！（触るな）';
        targetSub.innerText = '赤色はトラップ！ そのまま静止して耐えろ！';
        playBeep(300, 'sawtooth', 0.15, 0.15);

        // 1.3秒間我慢しきれたら成功判定
        nogoTimer = setTimeout(() => {
          if (state === 'nogo') {
            playBeep(660, 'sine', 0.2, 0.1);
            document.getElementById(`cell-${currentIdx}`).classList.add('done');
            currentIdx++;
            state = 'interval';
            viewport.className = 'view-idle';

            if (currentIdx >= BASE_TRIALS.length) {
              finishTest();
            } else {
              targetIcon.innerText = '🛡️';
              targetMain.innerText = 'ナイス自制！ ブレーキ成功';
              targetSub.innerText = `画面タップで第 ${currentIdx + 1} 回目へ`;
              updateHudCells();
            }
          }
        }, 1300);
      }
    }

    function finishTest() {
      state = 'finished';
      viewport.className = 'view-idle';
      reportModal.style.display = 'flex';
      playBeep(990, 'sine', 0.4, 0.2);

      const avgSpeed = recordedTimes.length > 0
        ? Math.round(recordedTimes.reduce((a, b) => a + b, 0) / recordedTimes.length)
        : 450;

      const totalTraps = BASE_TRIALS.filter(t => t === 'nogo').length;
      const brakeSuccesses = totalTraps - trapFailCount;
      const brakeRate = Math.round((brakeSuccesses / totalTraps) * 100);

      // 基準値: 平均340ms, 標準偏差50ms
      let deviation = Math.round(50 + ((340 - avgSpeed) / 50) * 10);
      if (deviation > 85) deviation = 85;
      if (deviation < 20) deviation = 20;

      let percentile = Math.round(100 / (1 + Math.exp((avgSpeed - 340) / 40)));
      if (percentile < 1) percentile = 1;
      if (percentile > 99) percentile = 99;

      let rank = '';
      let title = '';
      let comment = '';

      if (avgSpeed <= 260 && trapFailCount === 0) {
        rank = '神速・S級';
        title = '【極限動体判断】超一流プロゲーマー・戦闘機搭乗員級';
        comment = `平均反応速度 ${avgSpeed} ミリ秒、トラップ回避率100%。不意打ちの合図に対して常人を遥かに凌駕する神経伝達速度を発揮しつつ、赤色のブレーキも完璧に作動しています。世界トップレベルの脳の瞬発力です。`;
      } else if (avgSpeed <= 320 && trapFailCount === 0) {
        rank = '猛者・A級';
        title = '【超俊敏ブレイン】上位アクションプレイヤー級';
        comment = `平均反応速度 ${avgSpeed} ミリ秒。一般成人の平均（約340ミリ秒）を大きく突き放しています。いつ来るか分からない極限の待機時間にも集中を切らさず、色判断と指先の連動が極めてスムーズです。`;
      } else if (avgSpeed <= 380 && trapFailCount <= 1) {
        rank = '優秀・B級';
        title = '【健康優良脳】現役バリバリの運動判断力';
        comment = `平均反応速度 ${avgSpeed} ミリ秒。判断を伴う反応速度として非常に健全で安定しています。突発的な出来事にも冷静に対処できる脳のブレーキ機能がしっかり保たれています。`;
      } else if (trapFailCount >= 2) {
        rank = '突撃兵・C級';
        title = '【アクセル全開】ブレーキ故障の熱血脳';
        comment = `スピードを意識するあまり、赤色のトラップに指が釣られてしまいました。反射神経そのものは鋭いものの、目からの視覚情報を脳内で選別する前に指が動いてしまっています。リラックスして視野を広げてみましょう。`;
      } else {
        rank = '要休養・D級';
        title = '【エネルギー低下】冬眠直前のおやすみモード';
        comment = `平均反応速度 ${avgSpeed} ミリ秒。視覚刺激への反応がやや緩やかになっています。睡眠不足や目の疲れ、スマートフォンの長時間操作で神経伝達が一時的に鈍っている可能性があります。しっかり休んで挑みましょう。`;
      }

      document.getElementById('rep-rank').innerText = rank;
      document.getElementById('rep-title').innerText = title;
      document.getElementById('rep-speed').innerText = `${avgSpeed} ms`;
      document.getElementById('rep-brake').innerText = `${brakeRate}% (${brakeSuccesses}/${totalTraps})`;
      document.getElementById('rep-dev').innerText = `約 ${deviation}`;
      document.getElementById('rep-percent').innerText = `上位 約 ${percentile}%`;
      document.getElementById('rep-analysis').innerText = comment;

      drawGraph(avgSpeed);

      window.lastReportData = 
`【条件判断・反射神経診断 HUD解析結果】
判定ランク：${rank}
獲得称号：${title}
━━━━━━━━━━━━━━
・平均判断速度：${avgSpeed} ms
・衝動ブレーキ率：${brakeRate}%
・全人類推定偏差値：約 ${deviation}
・全体位置：上位 約 ${percentile}%
━━━━━━━━━━━━━━
#反射神経測定 #GoNoGo診断 #脳機能テスト`;
    }

    // 正規分布グラフ描画
    function drawGraph(userSpeed) {
      const cvs = document.getElementById('chart-canvas');
      const ctx = cvs.getContext('2d');
      const w = cvs.width;
      const h = cvs.height;

      ctx.clearRect(0, 0, w, h);

      const mean = 340;
      const sigma = 50;
      const minX = 180;
      const maxX = 500;

      function gauss(x) {
        return Math.exp(-0.5 * Math.pow((x - mean) / sigma, 2));
      }

      // ベースライン
      ctx.strokeStyle = "rgba(30, 44, 79, 0.8)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(30, h - 25);
      ctx.lineTo(w - 30, h - 25);
      ctx.stroke();

      // 釣鐘カーブ
      ctx.beginPath();
      ctx.strokeStyle = "#00f0ff";
      ctx.lineWidth = 3;
      ctx.shadowBlur = 10;
      ctx.shadowColor = "#00f0ff";

      for (let px = 30; px <= w - 30; px++) {
        const ms = minX + ((px - 30) / (w - 60)) * (maxX - minX);
        const yVal = gauss(ms);
        const py = (h - 28) - (yVal * (h - 55));
        if (px === 30) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;

      // 平均線
      const avgPx = 30 + ((mean - minX) / (maxX - minX)) * (w - 60);
      ctx.strokeStyle = "rgba(130, 149, 185, 0.4)";
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(avgPx, 15);
      ctx.lineTo(avgPx, h - 25);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#8295b9";
      ctx.font = "11px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("人類平均 (340ms)", avgPx, h - 10);
      ctx.fillText("最速帯 (200ms)", 65, h - 10);
      ctx.fillText("遅延帯 (480ms)", w - 65, h - 10);

      // ユーザー位置
      const clamped = Math.max(minX, Math.min(maxX, userSpeed));
      const uPx = 30 + ((clamped - minX) / (maxX - minX)) * (w - 60);
      const uPy = (h - 28) - (gauss(clamped) * (h - 55));

      // 垂直線
      ctx.strokeStyle = "#ffe600";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(uPx, uPy);
      ctx.lineTo(uPx, h - 25);
      ctx.stroke();

      // 光るマーカー
      ctx.save();
      ctx.fillStyle = "#ffe600";
      ctx.shadowBlur = 15;
      ctx.shadowColor = "#ffe600";
      ctx.beginPath();
      ctx.arc(uPx, uPy, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = "#ffe600";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`あなた: ${userSpeed}ms`, uPx, Math.max(20, uPy - 10));
    }

    function resetTest() {
      trialQueue = [...BASE_TRIALS].sort(() => Math.random() - 0.5);
      currentIdx = 0;
      recordedTimes = [];
      trapFailCount = 0;
      misfireCount = 0;
      state = 'idle';

      reportModal.style.display = 'none';
      toastMsg.style.display = 'none';
      viewport.className = 'view-idle';

      targetIcon.innerText = '🎯';
      targetMain.innerText = '画面タップで開始';
      targetSub.innerText = '緑が出たら最速タップ / 赤は絶対に押すな';

      initRounds();
      updateHudCells();
    }

    function copyReport() {
      if (window.lastReportData) {
        navigator.clipboard.writeText(window.lastReportData).then(() => {
          toastMsg.style.display = 'block';
          setTimeout(() => {
            toastMsg.style.display = 'none';
          }, 3000);
        });
      }
    }

    // 初回起動
    resetTest();
  </script>
